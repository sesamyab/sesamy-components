name: Playwright Tests - Cron runner
on:
  schedule:
    - cron: '0 2 * * *' # every day at 02:00 (UTC)

permissions:
  contents: read # Required for actions/checkout
  actions: read # Required for actions/upload-artifact

jobs:
  playwright-cron:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    permissions:
      actions: write # Required for actions/upload-artifact (job-scope only)

    steps:
      - name: Checkout ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install dependencies
        run: yarn
      - name: Run Playwright tests
        run: yarn test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
      - name: Report failed test
        if: failure()
        uses: fjogeleit/http-request-action@551353b829c3646756b2ec2b3694f819d7957495 # v2.0.0
        with:
          url: ${{ secrets.SLACK_HOOK_TEST_RESULTS }}
          method: 'POST'
          data: |
            {
              "status": "failed 💥",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "test": "sesamy-components cron job"
            }
      - name: Report successful test
        if: success()
        uses: fjogeleit/http-request-action@551353b829c3646756b2ec2b3694f819d7957495 # v2.0.0
        with:
          url: ${{ secrets.SLACK_HOOK_TEST_RESULTS }}
          method: 'POST'
          data: |
            {
              "status": "success ✅",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "test": "sesamy-components cron job"
            }
