name: Create Release PR

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  create-release-pr:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or Update Release PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const START = '<!-- release-pr:start -->';
            const END = '<!-- release-pr:end -->';
            // Body the pre-marker workflow wrote; matched only when a blank line or the end follows it.
            const LEGACY =
              /^## Automated release PR from dev to main\r?\n\r?\n(?:### PRs included in this release:\r?\n\r?\n(?:- #\d+\r?\n)+|_No PRs found since the last release\._\r?\n)(?=\r?\n|$)/;

            const refSha = async (branch) => {
              try {
                const { data } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
                return data.object.sha;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            };

            const mainSha = await refSha('main');
            const devSha = await refSha('dev');
            if (!mainSha || !devSha) {
              core.info('main or dev does not exist. Skipping.');
              return;
            }

            const perPage = 100;
            const commitShas = new Set();
            let oldestCommitDate = Infinity;
            for (let page = 1; ; page++) {
              const { data } = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: mainSha,
                head: devSha,
                per_page: perPage,
                page,
              });
              data.commits.forEach(({ sha, commit }) => {
                commitShas.add(sha);
                oldestCommitDate = Math.min(oldestCommitDate, Date.parse(commit.committer.date));
              });
              if (data.commits.length < perPage || commitShas.size >= data.total_commits) break;
            }

            if (commitShas.size === 0) {
              core.info('dev has no commits that main lacks. Skipping.');
              return;
            }

            const scanUntil = oldestCommitDate - 60 * 60 * 1000;
            const includedPRs = [];
            for await (const { data: prs } of github.paginate.iterator(github.rest.pulls.list, {
              owner,
              repo,
              base: 'dev',
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: perPage,
            })) {
              includedPRs.push(...prs.filter((pr) => pr.merged_at && commitShas.has(pr.merge_commit_sha)));
              if (prs.length === 0 || Date.parse(prs[prs.length - 1].updated_at) < scanUntil) break;
            }
            includedPRs.sort((a, b) => Date.parse(a.merged_at) - Date.parse(b.merged_at));

            const section = [
              START,
              '## Automated release PR from dev to main',
              '',
              ...(includedPRs.length > 0
                ? ['### PRs included in this release:', '', ...includedPRs.map(({ number }) => `- #${number}`)]
                : ['_No PRs found since the last release._']),
              END,
            ].join('\n');

            const withSection = (body) => {
              const current = body ?? '';
              const start = current.indexOf(START);
              const end = start === -1 ? -1 : current.indexOf(END, start);
              if (end !== -1) return current.slice(0, start) + section + current.slice(end + END.length);
              const legacy = current.match(LEGACY);
              if (legacy) return `${section}\n${current.slice(legacy[0].length)}`;
              return current.trim() === '' ? section : `${current}\n\n${section}`;
            };

            const findOpen = async () => {
              const { data } = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:dev`,
                base: 'main',
                state: 'open',
              });
              return data[0];
            };

            const updateSection = async (pr) => {
              const body = withSection(pr.body);
              if (body === (pr.body ?? '')) {
                core.info(`Release PR is up to date: ${pr.html_url}`);
                return;
              }
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body });
              core.info(`Updated release PR: ${pr.html_url}`);
            };

            const existing = await findOpen();
            if (existing) {
              await updateSection(existing);
              return;
            }

            try {
              const { data } = await github.rest.pulls.create({
                owner,
                repo,
                title: 'Release',
                head: 'dev',
                base: 'main',
                body: section,
              });
              core.info(`Created release PR: ${data.html_url}`);
            } catch (error) {
              if (error.status !== 422) throw error;
              const raced = await findOpen();
              if (raced) {
                await updateSection(raced);
                return;
              }
              if (/no commits between/i.test(error.message)) {
                core.info('No changes between dev and main. Skipping.');
                return;
              }
              throw error;
            }
